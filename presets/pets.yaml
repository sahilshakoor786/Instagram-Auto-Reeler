  niche: {funnycats: 0.6, funnydogs: 0.6, cutepets: 0.55, petlovers: 0.5, catlover: 0.5, doglover: 0.5}
  categories:
    funny_cat: {funnycats: 0.65, catvideos: 0.5}
    funny_dog: {funnydogs: 0.65, dogvideos: 0.5}
    cute: {cuteanimals: 0.6, cutepets: 0.55}
    zoomies: {zoomies: 0.45}
    sleeping: {sleepycat: 0.4, sleepydog: 0.4}
    wholesome: {wholesome: 0.45, petlove: 0.45}
    other: {pets: 0.7}
