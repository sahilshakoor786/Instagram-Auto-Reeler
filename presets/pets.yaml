# Ready-made settings for a funny / cute pets page. Use it with:  preset: pets
niche: "funny and cute pets (cats and dogs)"
youtube:
  category_id: "15"   # Pets & Animals

niche_profile:
  topic: "pets"
  categories: [funny_cat, funny_dog, cute, zoomies, sleeping, playing, talking, fail, wholesome, other]
  hook_examples: ["WAIT FOR HIS FACE", "SHE KNEW EXACTLY WHAT SHE DID", "THE ZOOMIES HIT", "TOO CUTE TO HANDLE"]
  music: [funny, cute, upbeat, lofi, cartoon]

hashtags:
