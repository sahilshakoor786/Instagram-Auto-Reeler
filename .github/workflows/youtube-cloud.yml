name: Cloud YouTube Shorts

on:
  # 5 posts a day, PC not needed. Times are UTC = India time minus 5:30 (09:43, 12:43, 15:43, 18:43, 21:43 IST).
  schedule:
    - cron: "13 4,7,10,13,16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (prepare only, nothing uploaded)"
        type: boolean
        default: false
      count:
        description: "How many to post in this run (they go out 20 minutes apart)"
        type: number
        default: 1

permissions:
  contents: write

concurrency:
  group: youtube-cloud
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt yt-dlp

      - name: YouTube login
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p .cache/work
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .cache/work/youtube_token.json

      - name: Post next video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: >
          python -m reeler -c config.youtube-cloud.yaml cloud-post
          --count ${{ inputs.count || 1 }} --gap-minutes 20
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save posting history
        if: ${{ always() && !inputs.dry_run }}
        run: |
          rm -f .cache/work/youtube_token.json
          git config user.name "reeler-bot"
          git config user.email "reeler-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update YouTube posting history [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
